workflows:
  android-debug:
    name: Tap Tap Android APK
    instance_type: mac_mini_m2
    max_build_duration: 20

    environment:
      java: 17
      xcode: latest

    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper

    scripts:
      - name: Configure Android SDK
        script: |
          set -euo pipefail
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
          echo "Android SDK: $ANDROID_SDK_ROOT"
          java -version

      - name: Verify Gradle
        script: |
          set -euo pipefail
          GRADLE_BIN="/Users/builder/programs/gradle-8.14.1/bin/gradle"
          if [ ! -x "$GRADLE_BIN" ]; then
            GRADLE_BIN="$(command -v gradle)"
          fi
          echo "Using Gradle: $GRADLE_BIN"
          "$GRADLE_BIN" --version

      - name: Build debug APK
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          GRADLE_BIN="/Users/builder/programs/gradle-8.14.1/bin/gradle"
          if [ ! -x "$GRADLE_BIN" ]; then
            GRADLE_BIN="$(command -v gradle)"
          fi
          echo "=== TAP TAP BUILD START ==="
          "$GRADLE_BIN"             --no-daemon             --console=plain             --stacktrace             --info             :app:assembleDebug
          echo "=== TAP TAP BUILD COMPLETE ==="
          test -f app/build/outputs/apk/debug/app-debug.apk
          shasum -a 256 app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
