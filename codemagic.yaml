workflows:
  android-debug:
    name: Tap Tap Android APK
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      java: 17

    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/gradle-8.9

    scripts:
      - name: Configure Android SDK
        script: |
          set -e
          echo "Configuring Android SDK..."
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
          echo "Android SDK ready."

      - name: Install Gradle 8.9
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          echo "Preparing Gradle 8.9..."
          if [ ! -x "$HOME/gradle-8.9/bin/gradle" ]; then
            curl --fail --location --retry 3 --output "$HOME/gradle-8.9-bin.zip" https://services.gradle.org/distributions/gradle-8.9-bin.zip
            rm -rf "$HOME/gradle-8.9"
            unzip -q "$HOME/gradle-8.9-bin.zip" -d "$HOME"
          else
            echo "Using cached Gradle 8.9."
          fi
          "$HOME/gradle-8.9/bin/gradle" --version

      - name: Build debug APK
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          echo "Starting Tap Tap APK build..."
          "$HOME/gradle-8.9/bin/gradle" --no-daemon --console=plain :app:assembleDebug
          echo "APK build finished."
          ls -lah app/build/outputs/apk/debug/

    artifacts:
      - app/build/outputs/apk/debug/*.apk
