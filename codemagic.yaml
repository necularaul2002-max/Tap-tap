workflows:
  android-debug:
    name: Tap Tap Android APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Configure Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Install Gradle 8.9
        script: |
          cd "$CM_BUILD_DIR"
          curl -L -o gradle-8.9-bin.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          "$CM_BUILD_DIR/gradle-8.9/bin/gradle" --version

      - name: Build debug APK
        script: |
          cd "$CM_BUILD_DIR"
          "$CM_BUILD_DIR/gradle-8.9/bin/gradle" :app:assembleDebug --stacktrace

    artifacts:
      - app/build/outputs/apk/debug/*.apk
