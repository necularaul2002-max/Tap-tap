name: Tap Tap V1 Beta APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.14.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.1'

      - name: Build Tap Tap V1 Beta APK
        run: |
          set -euo pipefail
          echo "=== TAP TAP V1 BETA BUILD START ==="
          gradle --no-daemon --console=plain --stacktrace :app:assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/TapTap-v1-beta.apk
          echo "=== TAP TAP V1 BETA BUILD COMPLETE ==="
          sha256sum app/build/outputs/apk/debug/TapTap-v1-beta.apk
          ls -lh app/build/outputs/apk/debug/TapTap-v1-beta.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TapTap-v1-beta
          path: app/build/outputs/apk/debug/TapTap-v1-beta.apk
          if-no-files-found: error
          retention-days: 30
